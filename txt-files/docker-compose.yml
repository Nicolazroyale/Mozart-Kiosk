services:
  db:
    image: mariadb:11
    container_name: kiosco-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpassword}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-gestion_tecnica_n3}
      MARIADB_USER: ${DB_USER:-kiosco_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-kiosco_pass}
    volumes:
      - db_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"

  web:
    build:
      context: .
      dockerfile: Dockerfile.apache
    container_name: kiosco-web
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-kiosco_user}
      DB_PASSWORD: ${DB_PASSWORD:-kiosco_pass}
      DB_NAME: ${MARIADB_DATABASE:-gestion_tecnica_n3}
    volumes:
      - ./public-html:/var/www/html

volumes:
  db_data:
